name: Cinder gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address, thread]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make setup
      - run: make lint
      - name: Unit, model, fuzz, concurrent and socket gates
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          if [ "${{ matrix.sanitizer }}" = none ]; then
            make test
            make scan
            make container-test
          else
            make test BUILD=build-${{ matrix.sanitizer }} SANITIZER=${{ matrix.sanitizer }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-${{ matrix.sanitizer }}-evidence
          path: docs/results/
